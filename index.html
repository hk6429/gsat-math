<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>學測數學考古題｜數學 A・數學 B</title>
  <meta name="description" content="大考中心正式學測數學 A、數學 B 歷屆試題互動練習，含官方答案、答對率與鑑別度。">
  <link rel="canonical" href="https://gsat-math.vercel.app/">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <a class="brand" href="index.html"><span class="brand-mark">∑</span><span>學測數學考古題</span></a>
      <nav class="nav" aria-label="主要導覽">
        <a href="index.html" aria-current="page">練習</a>
        <a href="check">查題</a>
        <a href="about.html">關於</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero shell">
      <p class="eyebrow">GSAT MATH ARCHIVE</p>
      <h1>公式不失真，答案有憑據。</h1>
      <p class="lede">把大考中心正式數學 A、數學 B 原卷變成可練習、可篩選、可核對的免費題庫。先忠實呈現，再談聰明功能。</p>
      <div class="stat-strip" aria-label="題庫統計">
        <div class="stat"><b id="questionCount">—</b><span>已收錄題目</span></div>
        <div class="stat"><b id="answerCount">—</b><span>選填題官方答案已比對</span></div>
        <div class="stat"><b id="statsCount">—</b><span>官方 P、D 統計覆蓋</span></div>
        <div class="stat"><b id="formCount">—</b><span>年份與試卷</span></div>
      </div>
    </section>

    <section class="workspace shell">
      <aside class="panel filters">
        <h2>篩選題目</h2>
        <div class="field"><label for="yearSel">年份</label><select id="yearSel"></select></div>
        <div class="field"><label for="subjectSel">考科</label><select id="subjectSel"></select></div>
        <div class="field"><label for="catSel">單元</label><select id="catSel"></select></div>
        <div class="field"><label for="kindSel">題型</label><select id="kindSel"><option value="all">全部題型</option><option value="single">單選題</option><option value="multi">多選題</option><option value="fill">選填題</option><option value="written">非選擇題</option></select></div>
        <div class="field"><label for="diffSel">難度</label><select id="diffSel"><option value="all">全部難度</option><option>較易</option><option>中等</option><option>較難</option></select></div>
        <div class="btn-row"><button class="btn" id="shuffleBtn" type="button">隨機排序</button></div>
        <p class="filter-note">難度依大考中心 P 值分級：70% 以上較易、40%～未滿 70% 中等、未滿 40% 較難。多選題 P 為得分率。</p>
      </aside>
      <div id="questionArea" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer"><div class="shell">題目、答案與統計資料均溯源至大考中心正式資料；本站與大考中心無隸屬關係。</div></footer>
  <script src="data/bank.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
